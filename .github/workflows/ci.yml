name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # PARTE JAVA (Spring Boot)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Java Linting & Tests
      run: mvn -B test verify
      
    # PARTE ANGULAR
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'ag-prueba-front/package-lock.json'

    - name: Angular Linting & Tests
      working-directory: ./ag-prueba-front
      run: |
        npm install
        npm run lint # OKR 3: Code Linting
        # npm test -- --watch=false --browsers=ChromeHeadless # Si tienes tests configurados

    # SONARCLOUD (OKR 3)
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
