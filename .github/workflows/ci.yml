name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # PARTE JAVA (Spring Boot)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    # Ejecutar tests y generar Jacoco en cada carpeta
    - name: Java Build & Test with Coverage
      run: |
        mvn -B clean verify -DskipTests

    # PARTE ANGULAR
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'ag-prueba-front/package-lock.json'

    - name: Angular Dependencies
      working-directory: ./ag-prueba-front
      run: |
        npm install

    # Usar Maven para mandar a Sonar
    - name: SonarCloud Scan via Maven
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=Manex142_POC-GPI2 \
          -Dsonar.organization=manex142 \
          -Dsonar.host.url=https://sonarcloud.io

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:8080'
        fail_action: false # Para que el build no muera si encuentra un aviso menor

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/target/*.jar
            **/target/bom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}